<div class="carousel-container">
  <div class="carousel-wrapper">
    <mat-card *ngFor="let card of cards" class="carousel-card" [ngClass]="'accent-' + card.accent">
      <div class="card-top">
        <span class="eyebrow">{{ card.eyebrow }}</span>
      </div>

      <div class="card-copy">
        <span class="metric">{{ card.metric }}</span>
        <mat-card-title>{{ card.title }}</mat-card-title>
      </div>

      <mat-card-content>
        <p>{{ card.description }}</p>
      </mat-card-content>

      <div class="tag-list">
        <span *ngFor="let tag of card.tags" class="tag">{{ tag }}</span>
      </div>
    </mat-card>
  </div>
</div>

<section class="experience-container">
  <div class="experience-header">
    <span class="eyebrow">Career timeline</span>
    <h1>
      < From <b> Front-End Engineer </b> to <b> AI Solution Lead </b> />
    </h1>
    <p class="intro">
      A path shaped by enterprise banking, digital lending, AI-powered
      platforms, and team leadership across modern front-end ecosystems.
    </p>

    <div class="cta-container">
      <button
        mat-raised-button
        color="primary"
        class="cta-button"
        (click)="downloadPDF()"
      >
        Download CV
      </button>
    </div>
  </div>

  <section class="experience-list">
    <div
      *ngFor="let experience of experiences; let i = index"
      #experienceEntry
      class="experience-entry"
      [class.is-visible]="revealedEntries[i]"
      [style.transitionDelay.ms]="i * 70"
    >
      <job-experience-card
        [jobTitle]="experience.jobTitle"
        [focusArea]="experience.focusArea"
        [contractType]="experience.contractType"
        [startDate]="experience.startDate"
        [endDate]="experience.endDate"
        [location]="experience.location"
        [companyName]="experience.companyName"
        [descriptions]="experience.descriptions"
      >
      </job-experience-card>
    </div>
  </section>
</section>
